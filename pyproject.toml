[project]
name = "cleanab"
version = "0.1.0"
description = "Fetch and clean FinTS/HBCI transactions and push them to connected apps"
authors = [{ name = "Jan Willhaus", email = "mail@janwillhaus.de" }]
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fints>=4",
    "pyyaml>= 6.0.1",
    "logzero>=1.7.0,<2",
    "click>=8.0",
    "requests>=2.28",
    "mt-940",
    "ynab-api",
    "pydantic>=2",
    "pillow>=11.2.0",
]

[project.scripts]
pycleanab = "cleanab.cli:cli"

[project.optional-dependencies]
ml-lite = [
    "scikit-learn>=1.7.2",
]

[dependency-groups]
models = [
    "gliner2[local]",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8",
    "scikit-learn>=1.7.2",
]

[tool.uv]

[tool.uv.sources]
ynab-api = { git = "https://github.com/dmlerner/ynab-api", rev = "08f099b4d77d7fbd02ffa68eed6241f938f3760f" }

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cleanab"]

[tool.pylint.messages_control]
disable = "all"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
